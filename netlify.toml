# ═══════════════════════════════════════════════
# Netlify Configuration — Pharma System Frontend
# ═══════════════════════════════════════════════

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ✅ SPA redirect — يضمن أن React Router يعمل عند تحديث أي صفحة
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200